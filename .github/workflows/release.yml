name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (sem o v), ex.: 0.1.7"
        required: true

permissions:
  contents: write

concurrency:
  group: release-windows-installer
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish NSIS
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # O changelog compara com a tag anterior, que não existe num clone raso.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release version
        shell: pwsh
        run: |
          # A tag manda: publicar v0.1.7 com package.json em 0.1.6 geraria um
          # instalador que não corresponde ao nome do release.
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } elseif ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = node -p "require('./package.json').version"
          }
          if ($version -notmatch "^\d+\.\d+\.\d+") {
            throw "Versão inválida: '$version'. Use uma tag no formato v0.1.7."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set release version
        run: node scripts/set-release-version.mjs $env:RELEASE_VERSION

      - name: Require updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing secret TAURI_SIGNING_PRIVATE_KEY. Paste the contents of src-tauri/keys/ghostbox.key."
          }

      - name: Configure Authenticode signing
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE) {
            throw "Missing secret WINDOWS_SIGNING_CERTIFICATE. Set it to the base64-encoded Authenticode PFX."
          }
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw "Missing secret WINDOWS_SIGNING_CERTIFICATE_PASSWORD."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "ghostbox-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password
          if (-not $certificate) { throw "The Authenticode certificate could not be imported." }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName "certificateThumbprint" -NotePropertyValue $certificate.Thumbprint -Force
          $config.bundle.windows | Add-Member -NotePropertyName "digestAlgorithm" -NotePropertyValue "sha256" -Force
          $config.bundle.windows | Add-Member -NotePropertyName "timestampUrl" -NotePropertyValue "http://timestamp.digicert.com" -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $targets = @(
            "src-tauri/target/release/ghostbox-tauri.exe",
            (Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1).FullName
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Expected executable not found: $target" }
            if ((Get-AuthenticodeSignature -LiteralPath $target).Status -ne "Valid") {
              throw "Authenticode verification failed: $target"
            }
          }

      - name: Find installer artifacts
        id: installer
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $nsisDir -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }

          $sig = Get-ChildItem -LiteralPath $nsisDir -Filter "*.sig" | Select-Object -First 1
          if (-not $sig) {
            $sigBeside = Get-Item -LiteralPath ($installer.FullName + ".sig") -ErrorAction SilentlyContinue
            if ($sigBeside) { $sig = $sigBeside }
          }
          if (-not $sig) { throw "Updater signature (.sig) was not generated. Check TAURI_SIGNING_PRIVATE_KEY." }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sig_path=$($sig.FullName)" >> $env:GITHUB_OUTPUT
          "sig_name=$($sig.Name)" >> $env:GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $previous = git tag --list "v*" --sort=-creatordate |
            Where-Object { $_ -ne "v$env:RELEASE_VERSION" } |
            Select-Object -First 1

          if ($previous) {
            $range = "$previous..HEAD"
            $header = "Mudanças desde $previous"
          } else {
            $range = "HEAD"
            $header = "Mudanças"
          }

          $commits = git log $range --no-merges --pretty=format:"- %s (%h)"
          if (-not $commits) { $commits = "- Sem mudanças registradas." }

          $body = @"
          ## $header

          $($commits -join "`n")
          "@

          # Delimitador para output multi-linha do Actions.
          "body<<CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "CHANGELOG_EOF" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: GhostBox v${{ env.RELEASE_VERSION }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ---
            Build automático para Windows a partir do commit ${{ github.sha }}.
          files: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.sig_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
