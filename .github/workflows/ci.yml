name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check design tokens
        run: npm run check:tokens

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Install subscriptions worker dependencies
        run: npm --prefix workers/subscriptions ci

      - name: Typecheck subscriptions worker
        run: npm --prefix workers/subscriptions run typecheck

      - name: Test subscriptions worker
        run: npm --prefix workers/subscriptions test

      - name: Install catalogue worker dependencies
        run: npm --prefix workers/catalogue ci

      - name: Typecheck catalogue worker
        run: npm --prefix workers/catalogue run typecheck

      - name: Test catalogue worker
        run: npm --prefix workers/catalogue test
