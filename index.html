<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./ghost-solid.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostBox</title>
    <style>
      :root {
        --background-dark: #070707;
        --border-subtle: #2a2a2a;
        --text-strong: #d8d8d8;
        --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      :root[data-window="tray"] #root > .app-splash {
        display: none;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--background-dark);
        color: var(--text-strong);
        font-family: var(--font-sans);
      }

      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        width: 100vw;
        height: 100vh;
        min-height: 0;
        place-items: center;
        background: var(--background-dark);
      }

      .app-splash__content {
        display: grid;
        justify-items: center;
        gap: 24px;
      }

      .app-splash__icon {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      .app-splash__spinner {
        box-sizing: border-box;
        width: 34px;
        height: 34px;
        border: 2px solid var(--border-subtle);
        border-top-color: var(--text-strong);
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).get("tray") === "1") {
        document.documentElement.dataset.window = "tray";
      }
    </script>
  </head>

  <body>
    <div id="root">
      <main class="app-splash" aria-label="Carregando interface">
        <div class="app-splash__content">
          <img class="app-splash__icon" src="./ghost-solid.png" alt="GhostBox" />
          <div class="app-splash__spinner" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
