<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ghost-solid.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostBox</title>
    <style>
      :root {
        --background-dark: #0b0b0b;
        --border-subtle: rgba(255, 255, 255, 0.075);
        --text-strong: #fafafa;
        --font-sans: "Open Sans", "Segoe UI", system-ui, sans-serif;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--background-dark);
        color: var(--text-strong);
        font-family: var(--font-sans);
      }

      .app-splash {
        display: grid;
        min-height: 100%;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.045), transparent 28%),
          var(--background-dark);
      }

      .app-splash__content {
        display: grid;
        justify-items: center;
        gap: 24px;
      }

      .app-splash__icon {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      .app-splash__spinner {
        width: 34px;
        height: 34px;
        border: 2px solid var(--border-subtle);
        border-top-color: var(--text-strong);
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="app-splash" aria-label="Carregando interface">
        <div class="app-splash__content">
          <img class="app-splash__icon" src="/ghost-solid.png" alt="GhostBox" />
          <div class="app-splash__spinner" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
