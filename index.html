<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./ghost-solid.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostBox</title>
    <style>
      :root {
        --c-0: #0a0a0a;
        --background-dark: var(--c-0);
        --border-subtle: #2a2a2a;
        --text-strong: #d8d8d8;
        --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      :root[data-window="tray"] #root > .app-splash {
        display: none;
      }

      html,
      body,
      #root {
        height: 100%;
        background: var(--background-dark);
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--background-dark);
        color: var(--text-strong);
        font-family: var(--font-sans);
      }

      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        width: 100vw;
        height: 100vh;
        min-height: 0;
        place-items: center;
        background: var(--background-dark);
      }

      .app-splash__content {
        display: grid;
        justify-items: center;
        gap: 24px;
      }

      .app-splash__icon {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      .app-splash__bar {
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
        width: 168px;
        height: 2px;
        border-radius: 999px;
        background: var(--border-subtle);
      }

      .app-splash__bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--text-strong);
        animation: app-splash-bar 1.2s ease-in-out infinite;
      }

      @keyframes app-splash-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__bar::before {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).get("tray") === "1") {
        document.documentElement.dataset.window = "tray";
      }
    </script>
  </head>

  <body>
    <div id="root">
      <main class="app-splash" aria-label="Carregando interface">
        <div class="app-splash__content">
          <img class="app-splash__icon" src="./ghost-solid.png" alt="GhostBox" />
          <div class="app-splash__bar" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
